syntax = "proto3";

package banking.v1;

// ConsiliumService — multi-owner authorization for the fund paying its OWN earned
// revenue out. One owner opens an invoice; strictly more than half of ALL owners must
// each confirm it from their mailbox before a single cent moves.
//
// WHY THE MONEY PLANE OWNS THIS. docs/ARCHITECTURE.md rejects letting a
// concierge-signed artifact authorize money movement, and a consilium verdict is
// exactly such an artifact. So the tally is computed, stored and verified here, against
// the owner roster this plane already mirrors (`0016_user_role.sql`). Concierge is used
// only to DELIVER the mail, over a typed payload it renders itself.
//
// QUORUM. `threshold = floor(N / 2) + 1` where N is the owner count at open. The
// initiator is in the denominator but gets NO vote and is never minted a token — so
// opening a request can never lower the bar the initiator has to clear. N < 3 makes
// the threshold unreachable and is refused at open rather than parked forever.
//
// IMMUTABILITY. There is no edit RPC. `payload_hash` binds every approval to the exact
// terms shown in the mail; changing anything means cancel and reopen, and votes are not
// carried over. See docs/CONSILIUM.md for the full policy and threat model.
service ConsiliumService {
  // Open an invoice to pay fund revenue out on-chain (Owner only). Refused when a
  // consilium is already open — one at a time removes the concurrent-approval
  // overdraw race instead of trying to win it — or when the roster is too small.
  rpc OpenRevenuePayout(OpenRevenuePayoutRequest) returns (Consilium);

  // Withdraw an invoice the caller opened, while it is still OPEN.
  rpc CancelConsilium(CancelConsiliumRequest) returns (Consilium);

  // One consilium in full, including per-voter state (Owner only).
  rpc GetConsilium(GetConsiliumRequest) returns (Consilium);

  // Consilia newest first — the governance history (Owner only).
  rpc ListConsilia(ListConsiliaRequest) returns (ConsiliumList);
}

// ConsiliumApprovalService — the surface an emailed owner reaches. Mounted OUTSIDE the
// user-auth layer, exactly as AuthService is: the emailed token IS the credential, and
// the owner clicking it may not be signed in.
//
// The GET is strictly read-only because mail scanners (Gmail, Outlook SafeLinks,
// corporate gateways) issue automatic requests for every URL in a message. The vote is
// a separate call carrying the secret code from the same mail — that is what turns a
// scanned link into a deliberate human act.
service ConsiliumApprovalService {
  // The redacted invitation behind an emailed token. Side-effect free. Unknown,
  // expired, spent and wrong-state tokens all return the SAME NOT_FOUND, so this
  // cannot be used to probe which is which.
  rpc GetInvitation(GetInvitationRequest) returns (ConsiliumInvitation);

  // Cast this owner's vote. Requires the token AND the secret code from the mail.
  // Five failed code attempts burn the token permanently.
  rpc SubmitDecision(SubmitDecisionRequest) returns (SubmitDecisionResponse);
}

// Where a consilium stands. Terminal everywhere except OPEN.
enum ConsiliumState {
  CONSILIUM_STATE_UNSPECIFIED = 0;
  // Collecting votes.
  CONSILIUM_STATE_OPEN = 1;
  // Quorum reached; the payout has not been created yet.
  CONSILIUM_STATE_APPROVED = 2;
  // Enough owners rejected that the threshold can no longer be reached.
  CONSILIUM_STATE_REJECTED = 3;
  // The 72h window closed with no verdict.
  CONSILIUM_STATE_EXPIRED = 4;
  // The initiator withdrew it.
  CONSILIUM_STATE_CANCELLED = 5;
  // The payout exists; `executed_withdrawal_id` points at it.
  CONSILIUM_STATE_EXECUTED = 6;
  // Approved, but the payout could not be created (e.g. revenue no longer covers it).
  // `failure_reason` says why. Nothing retries silently.
  CONSILIUM_STATE_EXECUTION_FAILED = 7;
}

// How one voter answered.
enum VoteDecision {
  VOTE_DECISION_UNSPECIFIED = 0;
  VOTE_DECISION_PENDING = 1;
  VOTE_DECISION_APPROVE = 2;
  VOTE_DECISION_REJECT = 3;
}

// The immutable subject of a revenue payout. Amounts are decimal USDT STRINGS, as
// everywhere else on this wire.
message RevenuePayoutTerms {
  // Rail the payout ships on (BEP20 / POLYGON / TRC20 / TON).
  string network = 1;
  // Destination address, rendered in FULL wherever a human approves it — a truncated
  // address in an approval mail is an invitation to approve the wrong one.
  string address = 2;
  // Gross USDT to pay out, capped by FundRevenue.available at execution.
  string amount = 3;
  // Free-text note from the initiator, shown in the mail. Never interpreted.
  string memo = 4;
}

// One owner's seat in a consilium.
message ConsiliumVoter {
  string user_id = 1;
  // Masked (`a***@example.com`) on every surface a non-owner can reach.
  string email = 2;
  VoteDecision decision = 3;
  // Unix seconds; 0 while pending.
  int64 decided_at = 4;
  // True once the mail has actually been handed to the delivery queue.
  bool notified = 5;
}

message Consilium {
  string id = 1;
  ConsiliumState state = 2;
  RevenuePayoutTerms revenue_payout = 3;
  // Hex SHA-256 over the canonical terms. Shown (short prefix) in the mail so an owner
  // can tell that what they approved is what will execute.
  string payload_hash = 4;
  string initiator_user_id = 5;
  string initiator_email = 6;
  // N — owners at open. The threshold is frozen from this, never recomputed later.
  uint32 owner_count = 7;
  uint32 threshold = 8;
  // Votes that are still valid: an approver who has since lost ownership does not count.
  uint32 approvals = 9;
  uint32 rejections = 10;
  repeated ConsiliumVoter voters = 11;
  int64 created_at = 12;
  int64 expires_at = 13;
  int64 decided_at = 14;
  // Set exactly once, on EXECUTED.
  string executed_withdrawal_id = 15;
  string failure_reason = 16;
  // Monotonic per consilium. The live page watches this and refetches when it moves —
  // the socket carries a version, never a tally.
  uint64 version = 17;
}

message ConsiliumList {
  repeated Consilium items = 1;
}

message OpenRevenuePayoutRequest {
  RevenuePayoutTerms terms = 1;
}

message CancelConsiliumRequest {
  string consilium_id = 1;
}

message GetConsiliumRequest {
  string consilium_id = 1;
}

message ListConsiliaRequest {
  // 0 means the server default.
  uint32 limit = 1;
}

message GetInvitationRequest {
  // The opaque single-use token from the mail. Never the code.
  string token = 1;
}

// What the emailed owner is shown BEFORE they vote. Deliberately narrower than
// `Consilium`: no other owner's identity, no vote-by-vote breakdown.
message ConsiliumInvitation {
  string consilium_id = 1;
  ConsiliumState state = 2;
  RevenuePayoutTerms revenue_payout = 3;
  string payload_hash = 4;
  // Who opened it, masked.
  string initiator_email = 5;
  // The recipient's own masked address, so they can confirm the mail reached the right
  // seat before typing the code.
  string voter_email = 6;
  uint32 threshold = 7;
  uint32 approvals = 8;
  uint32 owner_count = 9;
  int64 created_at = 10;
  int64 expires_at = 11;
  // This seat's own answer, so a reopened link shows what was already said.
  VoteDecision decision = 12;
  // Code attempts left before the token burns.
  uint32 attempts_remaining = 13;
}

message SubmitDecisionRequest {
  string token = 1;
  // The secret code from the same mail. Compared in constant time, as a hash.
  string code = 2;
  // APPROVE or REJECT. PENDING is rejected as an invalid argument.
  VoteDecision decision = 3;
  // Audit only — the edge supplies these; they are never trusted for authorization.
  string client_ip = 4;
  string user_agent = 5;
}

message SubmitDecisionResponse {
  // The invitation as it stands after the vote.
  ConsiliumInvitation invitation = 1;
  // True when this vote carried the consilium to its verdict.
  bool decided = 2;
}
