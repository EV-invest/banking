syntax = "proto3";

package banking.v1;

// BookService — the secondary market in an allocation's units: holders trading with
// each other on a central limit order book, price-time priority, in the shape of a spot
// exchange.
//
// It sits BESIDE the fund's own dealing, never instead of it. FundsService.Subscribe and
// Redeem are dealings with the fund at NAV; the book is holders dealing with holders at
// whatever they agree. NAV stays the accounting price — a position, its P&L and the fee
// high-water mark are measured at it — and the book's last trade is a second, market
// quote shown next to it (`BookSnapshot.nav` carries the mark so a ticker can show both).
//
// Money never leaves the ledger's custody: a resting order is an ESCROW inside it. A sell
// moves its units from the holder's `shares` account into a per-user book escrow, a buy
// moves its worst-case cash — size × price plus the taker fee it might owe — from the
// user's claim into a per-user cash escrow. A fill is ONE linked TigerBeetle batch (units
// to the buyer, cash to the seller, the taker's fee to the fund): delivery versus payment
// or nothing. Whatever the escrow still holds when an order ends is handed back, so a buy
// that filled below its limit, an IOC remainder and a cancel all release the difference.
// The hub records the order and its fills first (Postgres, under one lock per book) and
// the ledger moves follow through the same outbox relay as every other money event, so
// the balances a client reads lag a placement by the relay's latency, exactly as after a
// Subscribe.
//
// Who may trade: any signed-in investor whose effective access on the allocation is
// `invest` — the same gate as Subscribe, EXCEPT that the allocation's `state` does not
// apply (a `closed` product's holders may still trade among themselves; only `book_open`
// on the policy, `hidden` and `view` refuse). Placing is also refused while the money
// plane is in read-only mode or the caller is frozen; cancelling never is, so a frozen
// user can still unwind. The policy (fees, tick, lot, slippage, whether the book is open
// at all) is set by an `AllocationManage` holder; a product with no policy row has a
// closed book.
//
// Every amount, size and price is a decimal STRING (proto3 has no u128; a string is
// lossless and matches proto-loader's `longs: String`). Enumerations are strings too,
// pinned in `evbanking_contracts::book`. See piggybank/core/PATTERNS.md.
service BookService {
  // Place an order for the caller. Limit orders carry a `price` on the policy's tick;
  // market orders leave it empty and are priced by the hub from the best opposite quote
  // ± the policy's slippage, then run as an IOC limit at that price (an empty opposite
  // side is FAILED_PRECONDITION). `size` is on the policy's lot.
  //
  // Refusals: `book_open = false`, or the caller below `invest` — FAILED_PRECONDITION;
  // a post-only (`alo`) order that would cross, or one that would trade against the
  // caller's own resting order — INVALID_ARGUMENT, nothing recorded; an insufficient
  // available balance or holding — INVALID_ARGUMENT.
  //
  // Idempotent by `client_order_id`, unique per caller: a retry of a timed-out call
  // returns the order the id already names. The same id for a DIFFERENT order is
  // ALREADY_EXISTS.
  rpc PlaceOrder(PlaceOrderRequest) returns (Order);

  // Take the caller's resting order off the book; its unspent escrow is released.
  // Idempotent on an already-cancelled order; a filled one is ALREADY_EXISTS.
  rpc CancelOrder(CancelOrderRequest) returns (Order);

  // The caller's resting orders (`open` | `partially_filled`), oldest first, optionally
  // on one allocation.
  rpc ListOpenOrders(ListOpenOrdersRequest) returns (OrderList);

  // The caller's orders in every state, newest first, optionally on one allocation.
  rpc ListOrderHistory(ListOrderHistoryRequest) returns (OrderList);

  // The caller's own fills, newest first: each carries the caller's side, their order
  // id and the fee they paid on it.
  rpc ListUserTrades(ListUserTradesRequest) returns (TradeList);

  // The aggregated book: the top `depth` price levels a side, the last trade, the
  // 24h figures, and the fund's NAV for the ticker. Readable by anyone who may view the
  // allocation; a hidden one is NOT_FOUND, as on AllocationsService.
  rpc GetBook(GetBookRequest) returns (BookSnapshot);

  // The public tape, newest first: price, size, the taker's side and the time. No
  // order ids and no parties — a counterparty is never disclosed.
  rpc ListTrades(ListTradesRequest) returns (TradeList);

  // OHLCV candles aggregated from the tape over `[from, to)`, one per non-empty bucket
  // at `resolution` (1m | 5m | 15m | 1h | 4h | 1d). Buckets with no trade are omitted —
  // a chart carries the last close forward itself.
  rpc ListCandles(ListCandlesRequest) returns (CandleList);

  // A server stream of `BookEvent`s: one frame now, then one per change to the book
  // (a placement, a fill, a cancel). A frame is the same snapshot GetBook answers, plus
  // the latest trades and `orders_revision` — the book revision at which the CALLER's
  // own orders last changed, so a client refetches ListOpenOrders only when that moves.
  // Frames coalesce: a burst of changes yields one frame with the latest state. No
  // other user's orders and no balances ride on it.
  rpc WatchBook(WatchBookRequest) returns (stream BookEvent);

  // The allocation's trading terms. Readable by anyone who may view the allocation.
  rpc GetBookPolicy(GetBookPolicyRequest) returns (BookPolicy);

  // Replace the allocation's trading terms (AllocationManage). Closing the book
  // (`book_open = false`) stops new orders; resting ones stay and may still be cancelled.
  rpc SetBookPolicy(SetBookPolicyRequest) returns (BookPolicy);
}

message PlaceOrderRequest {
  string service = 1;          // the allocation
  string side = 2;             // buy | sell
  string kind = 3;             // limit | market
  string tif = 4;              // gtc | ioc | alo (post-only); market orders are always ioc
  string price = 5;            // decimal USDT per unit, on the tick; EMPTY for market
  string size = 6;             // decimal units, on the lot, > 0
  string client_order_id = 7;  // required, 1..64 chars, unique per caller (the retry key)
}

message CancelOrderRequest {
  string order_id = 1;
}

message ListOpenOrdersRequest {
  string service = 1;  // empty = every allocation
}

message ListOrderHistoryRequest {
  string service = 1;  // empty = every allocation
  uint32 limit = 2;    // 0 = the server default (100); capped at 200
}

message ListUserTradesRequest {
  string service = 1;  // empty = every allocation
  uint32 limit = 2;    // 0 = the server default (100); capped at 200
}

message GetBookRequest {
  string service = 1;
  uint32 depth = 2;    // price levels a side; 0 = the server default (20); capped at 50
}

message ListTradesRequest {
  string service = 1;
  uint32 limit = 2;    // 0 = the server default (50); capped at 200
}

message ListCandlesRequest {
  string service = 1;
  string resolution = 2;  // 1m | 5m | 15m | 1h | 4h | 1d
  int64 from = 3;         // unix seconds, inclusive
  int64 to = 4;           // unix seconds, exclusive; 0 = now
}

message WatchBookRequest {
  string service = 1;
  uint32 depth = 2;    // as GetBook
}

message GetBookPolicyRequest {
  string service = 1;
}

message SetBookPolicyRequest {
  string service = 1;
  bool book_open = 2;
  uint32 taker_fee_bps = 3;        // 0..10000
  string price_tick = 4;           // decimal USDT, > 0; empty = 0.01
  string lot_size = 5;             // decimal units, > 0; empty = 0.0001
  uint32 market_slippage_bps = 6;  // 0..10000; how far past the best quote a market order may fill
}

// One order. `price` is the limit — for a market order, the limit the hub derived from
// the quote at placement. `filled`, `remaining`, `avg_fill_price` and `fee_paid` grow as
// fills land; `state` ends in `filled`, `cancelled` or `rejected` (`reject_reason` set —
// the ledger refused the escrow after the order was recorded, a raced over-spend the
// optimistic balance check could not see). `user_id` is populated only on the caller's
// own orders.
message Order {
  string id = 1;
  string service = 2;
  string user_id = 3;
  string side = 4;               // buy | sell
  string kind = 5;               // limit | market
  string tif = 6;                // gtc | ioc | alo
  string price = 7;              // decimal USDT per unit
  string size = 8;               // decimal units
  string filled = 9;             // decimal units
  string remaining = 10;         // decimal units (size − filled)
  string avg_fill_price = 11;    // decimal USDT per unit; empty until the first fill
  string fee_paid = 12;          // decimal USDT the caller paid as taker on this order
  string state = 13;             // open | partially_filled | filled | cancelled | rejected
  string reject_reason = 14;     // free text; set exactly when state = rejected
  string client_order_id = 15;
  int64 created_at = 16;         // unix seconds
  int64 updated_at = 17;         // unix seconds
  // Set exactly when state = cancelled: "" | user | ioc_remainder | market_remainder.
  // `user` is the owner's own cancel; the other two are the hub cancelling what an IOC
  // limit / a market order could not fill at once — such an order may still show
  // `filled > 0`, which is what makes the reason worth carrying.
  string cancel_reason = 18;
}

message OrderList {
  repeated Order orders = 1;
}

// One fill. On the public tape only `id`, `service`, `price`, `size`, `taker_side` and
// `executed_at` are populated. On the caller's own tape (ListUserTrades) `user_side` is
// the caller's side, `order_id` their order on it and `fee` what they paid (empty when
// they were the maker); the counterparty is never disclosed.
message Trade {
  string id = 1;
  string service = 2;
  string price = 3;         // decimal USDT per unit
  string size = 4;          // decimal units
  string taker_side = 5;    // buy | sell — the side that crossed the spread
  int64 executed_at = 6;    // unix seconds
  string user_side = 7;     // the caller's side; empty on the public tape
  string order_id = 8;      // the caller's order; empty on the public tape
  string fee = 9;           // decimal USDT the caller paid; empty on the public tape
}

message TradeList {
  repeated Trade trades = 1;
}

// One aggregated price level of one side.
message BookLevel {
  string price = 1;   // decimal USDT per unit
  string size = 2;    // decimal units resting at this price
  uint32 orders = 3;  // how many orders make it up
}

// The book as of `revision`. `bids` are best (highest) first, `asks` best (lowest)
// first. `last_price` / `last_side` describe the latest trade (empty before the first);
// `mid` and `spread` are empty unless both sides have a level. `volume_24h` is the units
// traded in the trailing day and `change_24h` the signed percent move of the last price
// against the last trade at or before 24h ago (empty when there is none). `nav` is the
// fund's current mark, carried so a ticker can show the two prices side by side.
message BookSnapshot {
  string service = 1;
  uint64 revision = 2;
  repeated BookLevel bids = 3;
  repeated BookLevel asks = 4;
  string last_price = 5;
  string last_side = 6;     // buy | sell — the taker's side of the last trade
  string mid = 7;
  string spread = 8;
  string nav = 9;
  string volume_24h = 10;   // decimal units
  string change_24h = 11;   // signed decimal percent, e.g. "-2.5"
  int64 as_of = 12;         // unix seconds the snapshot was taken
}

// One OHLCV bucket. `time` is the bucket's start, unix seconds.
message Candle {
  int64 time = 1;
  string open = 2;
  string high = 3;
  string low = 4;
  string close = 5;
  string volume = 6;  // decimal units
}

message CandleList {
  string service = 1;
  string resolution = 2;
  repeated Candle candles = 3;
}

// One frame of WatchBook. `orders_revision` is the book revision at which the caller's
// own orders on this allocation last changed (0 = never) — compare it with the previous
// frame's to know whether to refetch ListOpenOrders.
message BookEvent {
  BookSnapshot snapshot = 1;
  repeated Trade trades = 2;   // the latest public trades, newest first
  uint64 orders_revision = 3;
}

// One allocation's trading terms.
message BookPolicy {
  string service = 1;
  bool book_open = 2;
  uint32 taker_fee_bps = 3;
  string price_tick = 4;           // decimal USDT
  string lot_size = 5;             // decimal units
  uint32 market_slippage_bps = 6;
  int64 updated_at = 7;            // unix seconds; 0 when the product has no policy row (the defaults)
}
