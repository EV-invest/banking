cargo-features = ["codegen-backend"]

[workspace]
# `piggybank/` is the central backend: `core` (the hub server + composition root),
# `auth` (the auth service + shared verification lib), and `signer` (the separate-
# process key vault that holds chain private keys at rest) are sibling crates.
# `cabinet/backend` is the cabinet's BFF — a standalone HTTP service that
# orchestrates the money plane (this repo) and the concierge identity plane.
members = [
    "cabinet/backend",
    "contracts",
    "domain",
    "piggybank/auth",
    "piggybank/core",
    "piggybank/signer",
]
# `.tb-client` must live at the repo root, NOT inside a member dir: cargo's
# exclude check is `!explicit_member && excluded`, and member matching is
# prefix-based — anything under a member dir can never be excluded.
exclude = [".tb-client"]
resolver = "3"

[workspace.dependencies]
async-trait = "0.1.89"
# Browser-facing HTTP for the cabinet BFF (the rest of the workspace is gRPC-only).
axum = "0.8"
axum-extra = "0.10"
base64 = "0.22"
chacha20poly1305 = "0.10"
color-eyre = "0.6"
# Hub-internal crates. Other service repos depend on `evbanking_contracts` (and,
# transitively, `evbanking_auth`) by git, so they get the wire stubs and the shared
# auth verification flow from one place.
domain = { path = "domain" }
dotenvy = "0.15.7"
ed25519-dalek = "2"
ev = { version = "0.7.0", package = "ev_lib", default-features = false, features = ["architecture"] }
evbanking_auth = { path = "piggybank/auth" }
evbanking_contracts = { path = "contracts" }
# The shared verify-side flow (JWKS-cached local verification of concierge access
# JWTs) — the BFF's request credential is the shell-set `ev_access` cookie.
evconcierge_auth = { git = "https://github.com/EV-invest/concierge.git", rev = "ad7577d963f75eadb6c0f824b2cee86b844ce155" }
# The concierge identity plane's wire contracts, pulled in by git like any downstream
# consumer. The cabinet backend (the cross-plane orchestrator) and piggybank-core (the
# one-way lifecycle bridge consumer + the governance-mail sender) depend on it. Both pins
# sit at concierge main ad7577d (merge #90, the rev v0.9.0 tags), which moves two things
# the money plane can see. `PayoutOutcomeMail` grows a fourth, additive subject
# description — `fund` + `mark`, field 14 (concierge#88) — for a consilium over a fund's
# NAV mark; the relay refuses any mail that names both the payment tuple and a mark, and
# reads a lone `fund` as fee terms only while `mark` is empty, so the empty `mark` we send
# is exactly today's behaviour. And `SetKycLevel` now refuses PERMISSION_DENIED when the
# caller names their OWN account (concierge#78): KycManage is held by Admin as well as
# Owner and tier 1 is the withdrawal floor, so without it an operator could lift their own
# money gate.
# Carried over from v0.8.0 (0fb4426): `PayoutOutcomeMail`'s third subject description —
# `fund` + `FeeTerms current` + `FeeTerms proposed` (concierge#72) — so a fee-policy
# consilium's verdict and a burned token on it can be mailed to the owners like a payout's
# or a payment's (#233); the relay's `no_url` guard on every fee mail's `fund` narrowed to
# `://` and `www.`, so a slug carrying the bare word `http` is deliverable (banking#265);
# the two fee-policy mails of 824c604 (#70/#71: `FeePolicyApprovalMail` +
# `FeePolicyNoticeMail`); the verified payout destination of #69; and the payment mails of
# 1561338 (#62/#63).
evconcierge_contracts = { git = "https://github.com/EV-invest/concierge.git", rev = "ad7577d963f75eadb6c0f824b2cee86b844ce155" }
form_urlencoded = "1"
getrandom = { version = "0.3", features = ["wasm_js"] }
hex = "0.4"
http = "1"
jiff = "0.2"
# `rust_crypto` selects the pure-Rust provider (ed25519-dalek for our EdDSA tokens) —
# no C/aws-lc-rs toolchain, matching the rustls-only stance. The money plane does no
# third-party OAuth (Google sign-in lives wholly in concierge), so no RS256 / reqwest here.
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
k256 = "0.13"
num-bigint = "0.4"
prost = "0.14"
prost-build = "0.14"
# Shared Redis state (refresh families in auth, sessions in the cabinet BFF). rustls
# + tokio only, matching the workspace's no-native-tls stance; the connection-manager
# feature gives a reconnecting multiplexed handle. No-op until REDIS_URL is set.
redis = { version = "0.32", default-features = false, features = ["tokio-rustls-comp", "connection-manager", "script"] }
reqwest = { version = "0.12", default-features = false }
# Test-only, and only to name a process-level crypto provider: the hub's rustls carries
# both `ring` (tonic) and `aws-lc-rs` (reqwest), and while tonic's client falls back to
# ring on its own, rustls's server builder refuses to guess between the two — so a test
# that stands up a TLS server must install one first. Already in the lockfile transitively.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10"
sha3 = "0.10"
sqlx = "0.9.0"
# Constant-time equality for secret/CSRF comparisons (already in the lockfile transitively).
subtle = "2.6"
thiserror = "2.0.18"
# via the symlink (kept current by the flake shellHook), not the canonicalized store path - hardcoding the hash goes stale on every tigerbeetle derivation rebuild
tigerbeetle = { path = ".tb-client" }
time = "0.3"
tokio = "1.52.3"
# CancellationToken for cooperative graceful shutdown (signal → drain → exit). No
# default features — `sync::CancellationToken` is unconditional.
tokio-util = { version = "0.7.18", default-features = false }
# `TcpListenerStream`, so a test server can be handed an already-bound listener rather
# than re-binding a port it just released.
tokio-stream = { version = "0.1.18", default-features = false, features = ["net"] }
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tonic-health = "0.14"
tonic-web = "0.14"
tonlib-core = "0.26"
tower = "0.5.3"
tower-http = "0.6.11"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
# The remote key custodian the signer's `turnkey` backend signs through (see
# docs/MIGRATION-turnkey.md). The two crates ship as one lockstep-versioned pair — bump
# them together, never one alone.
turnkey_api_key_stamper = "0.15"
turnkey_client = "0.15"
uuid = "1.23.2"
zeroize = "1"

[workspace.lints.rust]
unused_features = "allow"

# smaller target/: trim debuginfo (deps need none), keep line tables for backtraces
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
