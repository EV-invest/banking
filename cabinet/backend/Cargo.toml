[package]
name = "cabinet-backend"
version = "0.1.0"
edition = "2024"
description = "The cabinet BFF — a standalone, stateless HTTP service that verifies the shell-set access-JWT cookie against the concierge JWKS and proxies the browser's JSON requests to the concierge identity plane and the piggybank money plane over gRPC."
license = "BlueOak-1.0.0"
publish = false
default-run = "cabinet-backend"

[[bin]]
name = "cabinet-backend"
path = "src/main.rs"

[dependencies]
# `ws` for the governance socket only — the rest of the surface is plain JSON.
axum = { workspace = true, features = ["ws"] }
axum-extra = { workspace = true, features = ["cookie"] }
color-eyre.workspace = true
dotenvy.workspace = true
ev = { workspace = true, features = ["analytics", "error_monitoring", "otel", "settings"] }
evbanking_contracts.workspace = true
evconcierge_auth.workspace = true
evconcierge_contracts.workspace = true
serde.workspace = true
serde_json.workspace = true
subtle.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["full"] }
tonic.workspace = true
tower-http = { workspace = true, features = ["timeout", "trace"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
jsonwebtoken.workspace = true
prost.workspace = true
tokio-stream.workspace = true
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
